name: Sync | Develop

on:
  workflow_run:
    workflows:
      - "Test | Action"
      #- "Test | Config" # temporarily excluded during refactor
      #- "Test | Console" # temporarily excluded during refactor
      - "Test | Error"
      - "Test | Error:Template"
      #- "Test | JarTest" # temporarily excluded during refactor
      #- "Test | Log" # temporarily excluded during refactor
      #- "Test | Jarbin-Toolkit" # temporarily excluded during refactor
      - "Test | Time"
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  gate:
    name: Verify all test workflows passed
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check all required workflows succeeded for this commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = [
              "Test | Action", "Test | Config", "Test | Console",
              "Test | Error:Template", "Test | Error", "Test | JarTest",
              "Test | Log", "Test | Jarbin-Toolkit", "Test | Time",
            ];

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              event: "push",
              per_page: 100,
            });

            const latestByName = new Map();
            for (const run of data.workflow_runs) {
              const existing = latestByName.get(run.name);
              if (!existing || new Date(run.run_started_at) > new Date(existing.run_started_at)) {
                latestByName.set(run.name, run);
              }
            }

            const missing = [];
            const notOk = [];
            for (const name of required) {
              const run = latestByName.get(name);
              if (!run) { missing.push(name); continue; }
              if (run.status !== "completed" || run.conclusion !== "success") {
                notOk.push(`${name} (${run.status}/${run.conclusion})`);
              }
            }

            if (missing.length) core.warning(`Not yet run for ${sha}: ${missing.join(", ")}`);
            if (notOk.length) core.warning(`Not successful for ${sha}: ${notOk.join(", ")}`);

            const proceed = missing.length === 0 && notOk.length === 0;
            core.setOutput("proceed", proceed ? "true" : "false");

  sync:
    name: Sync latest child branches
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync latest branches
        shell: bash
        env:
          DEVELOP_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -u

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          echo "Syncing using tested commit: $DEVELOP_SHA"

          failed=0
          failed_branches=()
          synced_branches=()

          for group in action config console error jartest log time package; do
              echo "::group::Finding latest $group branch"

              versions="$(
                  git for-each-ref \
                      --format='%(refname:strip=4)' \
                      "refs/remotes/origin/$group/" |
                  sort -V
              )"

              latest="$(printf '%s\n' "$versions" | tail -n 1)"

              if [ -z "$latest" ]; then
                  echo "::warning::No branch found for $group"
                  echo "::endgroup::"
                  continue
              fi

              branch="$group/$latest"

              echo "Latest branch: $branch"
              echo "::endgroup::"

              echo "::group::Merging $DEVELOP_SHA into $branch"

              if ! git checkout -B "$branch" "origin/$branch"; then
                  echo "::error::Failed to check out $branch"
                  failed=1
                  failed_branches+=("$branch (checkout failed)")
                  echo "::endgroup::"
                  continue
              fi

              if git merge --no-edit "$DEVELOP_SHA"; then
                  if git push origin "HEAD:refs/heads/$branch"; then
                      echo "Successfully synchronized $branch"
                      synced_branches+=("$branch")
                  else
                      echo "::error::Failed to push $branch"
                      failed=1
                      failed_branches+=("$branch (push failed)")
                  fi
              else
                  echo "::error::Merge conflict while synchronizing $branch"
                  git merge --abort || true
                  failed=1
                  failed_branches+=("$branch (merge conflict)")
              fi

              echo "::endgroup::"
          done

          {
            echo "### Sync results (commit: $DEVELOP_SHA)"
            if [ "${#synced_branches[@]}" -gt 0 ]; then
              echo "**Synced:** ${synced_branches[*]}"
            fi
            if [ "${#failed_branches[@]}" -gt 0 ]; then
              echo "**Failed:** ${failed_branches[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
